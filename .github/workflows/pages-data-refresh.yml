name: Pages Data Refresh

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-data-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      popup_changed: ${{ steps.diff.outputs.popup_changed }}
      courses_changed: ${{ steps.diff.outputs.courses_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest events
        run: npm run fetch:events -- --output-root=${{ runner.temp }}/pages-build
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          EVENTBRITE_ORGANIZATION_ID: ${{ secrets.EVENTBRITE_ORGANIZATION_ID }}

      - name: Fetch latest popup
        run: npm run fetch:popup -- --output-root=${{ runner.temp }}/pages-build
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_POPUP_DB_ID: ${{ secrets.NOTION_POPUP_DB_ID }}

      - name: Fetch latest courses
        run: npm run fetch:courses -- --output-root=${{ runner.temp }}/pages-build
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_COURSES_DB_ID: ${{ secrets.NOTION_COURSES_DB_ID }}

      - name: Detect event changes
        id: diff
        run: npm run events:diff -- --new-file=${{ runner.temp }}/pages-build/data/events.json --new-popup-file=${{ runner.temp }}/pages-build/data/popup.json --new-courses-file=${{ runner.temp }}/pages-build/data/courses.json

      - name: Build Pages artifact
        if: steps.diff.outputs.changed == 'true' || steps.diff.outputs.popup_changed == 'true' || steps.diff.outputs.courses_changed == 'true'
        run: npm run build:pages
        env:
          BUILD_DIR: ${{ runner.temp }}/pages-artifact
          SOURCE_EVENTS_PATH: ${{ runner.temp }}/pages-build/data/events.json
          SOURCE_POPUP_PATH: ${{ runner.temp }}/pages-build/data/popup.json
          SOURCE_COURSES_PATH: ${{ runner.temp }}/pages-build/data/courses.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.diff.outputs.changed == 'true' || steps.diff.outputs.popup_changed == 'true' || steps.diff.outputs.courses_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-artifact

      - name: No changes summary
        if: steps.diff.outputs.changed != 'true' && steps.diff.outputs.popup_changed != 'true' && steps.diff.outputs.courses_changed != 'true'
        run: echo "No event/popup/courses changes detected. Skipping artifact upload and deploy."

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true' || needs.build.outputs.popup_changed == 'true' || needs.build.outputs.courses_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
