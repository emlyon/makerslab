name: Pages Data Refresh

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-data-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      popup_changed: ${{ steps.diff.outputs.popup_changed }}
      courses_changed: ${{ steps.diff.outputs.courses_changed }}
      equipment_changed: ${{ steps.diff.outputs.equipment_changed }}
      tutorials_changed: ${{ steps.diff.outputs.tutorials_changed }}
      source_changed: ${{ steps.source_changes.outputs.source_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Fetch data
        run: npm run fetch:all -- --output-root=${{ runner.temp }}/pages-build
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          EVENTBRITE_ORGANIZATION_ID: ${{ secrets.EVENTBRITE_ORGANIZATION_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_POPUP_DB_ID: ${{ secrets.NOTION_POPUP_DB_ID }}
          NOTION_COURSES_DB_ID: ${{ secrets.NOTION_COURSES_DB_ID }}
          NOTION_EQUIPMENT_EN_DB_ID: ${{ secrets.NOTION_EQUIPMENT_EN_DB_ID }}
          NOTION_CATEGORIES_EN_DB_ID: ${{ secrets.NOTION_CATEGORIES_EN_DB_ID }}
          NOTION_TUTORIALS_EN_DB_ID: ${{ secrets.NOTION_TUTORIALS_EN_DB_ID }}
          NOTION_SOFTWARE_EN_DB_ID: ${{ secrets.NOTION_SOFTWARE_EN_DB_ID }}
          NOTION_EQUIPEMENTS_FR_DB_ID: ${{ secrets.NOTION_EQUIPEMENTS_FR_DB_ID }}
          NOTION_CATEGORIES_FR_DB_ID: ${{ secrets.NOTION_CATEGORIES_FR_DB_ID }}
          NOTION_TUTORIALS_FR_DB_ID: ${{ secrets.NOTION_TUTORIALS_FR_DB_ID }}
          NOTION_SOFTWARE_FR_DB_ID: ${{ secrets.NOTION_SOFTWARE_FR_DB_ID }}

      - name: Detect data changes
        id: diff
        run: npm run events:diff -- --new-file=${{ runner.temp }}/pages-build/data/events.json --new-popup-file=${{ runner.temp }}/pages-build/data/popup.json --new-courses-file=${{ runner.temp }}/pages-build/data/courses.json --new-equipment-file=${{ runner.temp }}/pages-build/data/equipment.json --new-tutorials-file=${{ runner.temp }}/pages-build/data/tutorials.json

      - name: Detect source-triggered run
        id: source_changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Pages artifact
        if: steps.diff.outputs.changed == 'true' ||
          steps.diff.outputs.popup_changed == 'true' ||
          steps.diff.outputs.courses_changed == 'true' ||
          steps.diff.outputs.equipment_changed == 'true' ||
          steps.diff.outputs.tutorials_changed == 'true' ||
          steps.source_changes.outputs.source_changed == 'true'
        run: npm run build:pages
        env:
          BUILD_DIR: ${{ runner.temp }}/pages-artifact
          SOURCE_EVENTS_PATH: ${{ runner.temp }}/pages-build/data/events.json
          SOURCE_POPUP_PATH: ${{ runner.temp }}/pages-build/data/popup.json
          SOURCE_CATEGORIES_PATH: ${{ runner.temp }}/pages-build/data/categories.json
          SOURCE_COURSES_PATH: ${{ runner.temp }}/pages-build/data/courses.json
          SOURCE_EQUIPMENT_PATH: ${{ runner.temp }}/pages-build/data/equipment.json
          SOURCE_TUTORIALS_PATH: ${{ runner.temp }}/pages-build/data/tutorials.json
          SOURCE_MEDIA_PATH: ${{ runner.temp }}/pages-build/media

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.diff.outputs.changed == 'true' ||
          steps.diff.outputs.popup_changed == 'true' ||
          steps.diff.outputs.courses_changed == 'true' ||
          steps.diff.outputs.equipment_changed == 'true' ||
          steps.diff.outputs.tutorials_changed == 'true' ||
          steps.source_changes.outputs.source_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-artifact

      - name: No changes summary
        if: steps.diff.outputs.changed != 'true' &&
          steps.diff.outputs.popup_changed != 'true' &&
          steps.diff.outputs.courses_changed != 'true' &&
          steps.diff.outputs.equipment_changed != 'true' &&
          steps.diff.outputs.tutorials_changed != 'true' &&
          steps.source_changes.outputs.source_changed != 'true'
        run: echo "No changes detected. Skipping artifact upload and deploy."

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true' ||
      needs.build.outputs.popup_changed == 'true' ||
      needs.build.outputs.courses_changed == 'true' ||
      needs.build.outputs.tutorials_changed == 'true' ||
      needs.build.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
