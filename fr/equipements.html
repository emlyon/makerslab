<!DOCTYPE html>
<html lang="fr">

<head>
    <script src="../js/include.js" charset="utf-8"></script>
    <script src="../includes/head.js" charset="utf-8"></script>
</head>

<!-- Global Site Tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-90298578-1"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'UA-90298578-1');
</script>

<body>
    <script src="../includes/navbar-fr.js" charset="utf-8"></script>

    <div id="index-banner">
        <div class="background" style="background:url(media/3D.jpg) no-repeat center center fixed; background-size: cover;"></div>

        <div class="content">
            <div style="width: 90%">
                <h1 class="header mob center white-text"><b>équipements</b></h1>

                <h4 class="header mob light center white-text">Découvrez les&nbsp;outils et&nbsp;machines disponibles au&nbsp; makers' lab</h4>

                <div style="margin-top: 4em" class="row center">
                    <div id="equipmentCategoriesMenu" class="equipment-categories-menu"></div>
                </div>
                <div class="row center" style="margin-top: 1em;">
                    <div id="equipmentSearchRoot"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="container" id="equipment-list">
            <h4 style="margin-top:60px" class="red-text"><b>Équipements</b></h4>
            <div id="equipmentRoot"></div>
            <div class="row center" style="margin-top: 2em;">
                <div class="equipment-categories-menu"></div>
            </div>
        </div>
    </div>

    <script id="equipment-categories-template" type="text/x-handlebars-template">
        {{#if hasCategories}}
            <p>
                {{#each categories}}
                    <a
                        href="#{{anchorId}}"
                        data-category-id="{{id}}"
                        data-color="{{color}}"
                        class="btn-large badge waves-effect waves-light equipment-category-btn {{#ifEquals id ../selectedCategoryId}}active{{/ifEquals}}"
                        style="padding: 5; margin:10px; border-width:2px; border-style:solid; background-color: white;"
                    >{{name}}</a>
                {{/each}}
            </p>
        {{else}}
            <p class="white-text" style="font-size:1.1rem; line-height:1.8rem;">{{ui.menuNoCategoriesLabel}}</p>
        {{/if}}
    </script>

    <script id="equipment-template" type="text/x-handlebars-template">
        {{#if hasCategories}}
            <h5 id="{{headingAnchorId}}" class="grey-text text-darken-3"><b>{{headingLabel}}</b></h5>
            {{#if hasEquipment}}
                {{#each equipmentRows}}
                    <div class="row">
                        {{#each this}}
                            <div class="col s12 m6 l4">
                                <article id="{{anchorId}}" class="card flex-card equipment-card" data-color="{{cardColor}}">
                                    {{#if iconUrl}}
                                        <div class="card-image">
                                            <img src="{{iconUrl}}" alt="{{name}}">
                                        </div>
                                    {{/if}}
                                    <!-- Card body : used to contain the card's content together with flex-card -->
                                    <div class="card-body">
                                        <div class="card-content">
                                            <span class="card-title grey-text text-darken-4">{{name}}</span>
                                            {{#if type}}
                                                <p class="equipment-type" style="color: #666; font-size: 0.9em; margin: 8px 0;">{{type}}</p>
                                            {{/if}}
                                            <div class="card-tags">
                                                {{#if places.length}}
                                                    {{#each places}}
                                                        <span>📍 {{this}}</span>
                                                    {{/each}}
                                                {{/if}}
                                            </div>
                                        </div>
                                        <div class="card-action">
                                            <a class="btn waves-effect waves-light equipment-cta" href="{{notionUrl}}" target="_blank" rel="noopener noreferrer" data-color="{{cardColor}}">{{../../ui.ctaLabel}}</a>
                                        </div>
                                    </div>
                                </article>
                            </div>
                        {{/each}}
                    </div>
                {{/each}}
            {{else}}
                <p class="grey-text text-darken-1 flow-text">{{noEquipmentMessage}}</p>
            {{/if}}
        {{else}}
            <p class="grey-text text-darken-1 flow-text">{{ui.noCategoriesLabel}}</p>
        {{/if}}
    </script>

    <script src="../includes/footer-fr.js" charset="utf-8"></script>

    <script src="../includes/scripts.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" charset="utf-8"></script>
    <script>
        if (typeof Handlebars !== 'undefined') {
            Handlebars.registerHelper('ifEquals', function (left, right, options) {
                return left === right ? options.fn(this) : options.inverse(this);
            });
        }
    </script>
    <script src="../js/equipment.js" charset="utf-8"></script>
</body>

</html>
